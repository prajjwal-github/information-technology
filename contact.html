<div id="site-header"></div>

<main id="main-content">

  <!-- PAGE TITLE -->
  <section class="page-banner">
    <div class="container">
      <h1 class="page-banner-title">Contact</h1>
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="index.html">Home</a></li>
          <li class="breadcrumb-item active" aria-current="page">Contact</li>
        </ol>
      </nav>
    </div>

  <section class="page-body">
    <div class="container">
      <!-- ===== PAGE CONTENT START ===== -->
      <div class="page-content">
<div class="card">
<h6 class="card-header text-uppercase">Contact us</h6>
<div class="card-body">
<section class="mb-4">
<h2 class="h1-responsive font-weight-bold text-center my-4">Contact us</h2>
<p class="text-center w-responsive mx-auto mb-5">Do you have any questions? Please do not hesitate
                to contact us directly. Our team will come back to you within
                a matter of hours to help you.</p>
<div class="row">
<div class="col-md-9 mb-md-0 mb-5">
<form id="contact-form" method="POST">
<div class="row">
<div class="col-md-6">
<div class="md-form mb-0">
<label for="name">Your name</label>
<input class="form-control" id="name" name="name" type="text"/>
</div>
</div>
<div class="col-md-6">
<div class="md-form mb-0">
<label for="email">Your email</label>
<input class="form-control" id="email" name="email" type="text"/>
</div>
</div>
</div>
<div class="row">
<div class="col-md-12">
<div class="md-form mb-0">
<label for="subject">Subject</label>
<input class="form-control" id="subject" name="subject" type="text"/>
</div>
</div>
</div>
<div class="row">
<div class="col-md-12">
<div class="md-form">
<label for="message">Your message</label>
<textarea class="form-control md-textarea" id="message" name="message" rows="2" type="text"></textarea>
</div>
</div>
</div>
<br/>
<div class="text-center text-md-left">
<button class="btn btn-info" name="send" type="submit">Send</button>
</div>
<br/>
<div class="status">
</div>
</form></div>
<div class="col-md-3 text-center">
<ul class="list-unstyled mb-0">
<li><i class="fas fa-map-marker-alt fa-2x" onmouseout="this.style.color='black'; " onmouseover="this.style.color='#dc3545';"></i>
<p>India</p>
</li>
<li><i class="fas fa-phone mt-4 fa-2x" onmouseout="this.style.color='black'; " onmouseover="this.style.color='#dc3545';"></i>
<p>020-27653168-116</p>
</li>
<li><i class="fas fa-envelope mt-4 fa-2x" onmouseout="this.style.color='black'; " onmouseover="this.style.color='#dc3545';"></i>
<p>Pccoeitdept@gmail.com</p>
</li>
</ul>
</div>
</div>
</section>
</div>
</div>
      </div>
      <!-- ===== PAGE CONTENT END ===== -->
    </div>
